name: TIRA Belle Production CI & Security Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run Business Logic & Security Unit Tests
      run: |
        python tests/test_backend.py -v

    - name: Verify No Secrets or Private Keys in Repository
      run: |
        echo "Scanning for accidental secrets..."
        ! grep -riE "BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY" . --exclude-dir=".git"
        ! grep -riE "adminPassword:\s*['\"][^'\"]+['\"]" js/ --exclude="*.test.js"

    - name: Verify HTML & Assets Integrity
      run: |
        test -f index.html
        test -f admin.html
        test -f tracker.html
        test -f robots.txt
        test -f sitemap.xml
        test -f manifest.json
        echo "All core assets and SEO documents verified."
